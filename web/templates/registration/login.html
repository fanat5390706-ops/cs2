{% extends "web/base.html" %}
{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <h1 class="h3 mb-3">Вход</h1>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
      <div class="alert alert-danger">Неверное имя пользователя или пароль.</div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Имя пользователя</label>
        <input class="form-control" type="text" name="username" id="id_username" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Пароль</label>
        <input class="form-control" type="password" name="password" id="id_password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Войти</button>
    </form>
  </div>
</div>
{% endblock %}
